<header class="main-header">

  <!-- ======================================================
       IZQUIERDA
       ====================================================== -->

  <div class="header-left">

    <button
      type="button"
      class="header-icon-button"
      title="Buscar"
      aria-label="Buscar"
    >

      <lucide-icon
        [img]="icons.search"
        [size]="20"
      />

    </button>

  </div>


  <!-- ======================================================
       DERECHA
       ====================================================== -->

  <div class="header-right">


    <!-- ====================================================
         EXPORTAR EXCEL
         ==================================================== -->

    <button
      type="button"
      class="excel-button"
      title="Exportar notificaciones a Excel"
      (click)="exportarExcel()"
    >

      <lucide-icon
        [img]="icons.download"
        [size]="18"
      />

      <span>
        Exportar Excel
      </span>

    </button>


    <!-- ====================================================
         NOTIFICACIONES
         ==================================================== -->

    <button
      type="button"
      class="notification-button"
      title="Notificaciones"
      aria-label="Notificaciones"
      (click)="abrirNotificaciones()"
    >

      <lucide-icon
        [img]="icons.bell"
        [size]="21"
      />


      <!-- ================================================
           BADGE
           ================================================ -->

      @if (notificaciones().total > 0) {

        <span class="notification-badge">

          {{
            notificaciones().total > 99
              ? '99+'
              : notificaciones().total
          }}

        </span>

      }

    </button>


    <!-- ====================================================
         USUARIO
         ==================================================== -->

    <div class="user-container">

      <div class="user-avatar">

        <lucide-icon
          [img]="icons.user"
          [size]="22"
        />

      </div>


      <div class="user-information">

        <span class="user-name">

          {{
            usuarioLogueado()?.nombre
            || 'Usuario'
          }}

        </span>

        <span class="user-role">

          {{
            usuarioLogueado()?.rol
            || 'Usuario'
          }}

        </span>

      </div>

    </div>


    <!-- ====================================================
         LOGOUT
         ==================================================== -->

    <button
      type="button"
      class="logout-button"
      title="Cerrar sesión"
      aria-label="Cerrar sesión"
      (click)="onLogout()"
    >

      <lucide-icon
        [img]="icons.logout"
        [size]="19"
      />

    </button>

  </div>

</header>
